<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Forms of Living · dual row loop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      position: relative;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: filter 0.25s ease;
      will-change: filter;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100dvh;
      gap: 0;
      position: relative;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      perspective: 1200px;
      perspective-origin: 50% 50%;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .row {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      white-space: nowrap;
      overflow: hidden;
      position: relative;
      height: 29vh;
      flex: 0 0 29vh;
      margin: 0;
      padding: 0;
      transform-style: preserve-3d;
    }

    .row-top { perspective-origin: 50% 100%; }
    .row-bottom { perspective-origin: 50% 0%; }

    .row-track {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      will-change: transform;
      margin: 0;
      padding: 0;
      transform-style: preserve-3d;
    }

    .img-cell {
      position: relative;
      flex: 0 0 auto;
      height: 29vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 0;
      transform-style: preserve-3d;
    }

    .row-top .img-cell { justify-content: flex-end; }
    .row-bottom .img-cell { justify-content: flex-start; }

    .img-wrap {
      height: 24vh;
      flex: 0 0 24vh;
      width: 19.2vh;
      max-width: 45vw;
      overflow: hidden;
      display: block;
      margin: 0;
      padding: 0;
      line-height: 0;
      position: relative;
      transform-style: preserve-3d;
      will-change: transform, filter;
      transform-origin: 50% 50%;
    }

    .img-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      margin: 0;
      padding: 0;
      object-fit: cover;
      -webkit-user-drag: none;
      pointer-events: none;
      border-radius: 0;
      background: transparent;
      border: none;
      outline: none;
      box-shadow: none;
    }

    .annotation {
      height: 5vh;
      flex: 0 0 5vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      white-space: normal;
      overflow-wrap: break-word;
      word-break: break-word;
      line-height: 1.4;
      max-width: 19.2vh;
      padding: 0 2px;
      box-sizing: border-box;
      pointer-events: none;
      opacity: 0;
      filter: blur(4px);
      will-change: opacity, filter;
      text-shadow: none;
    }

    .static-text {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 100%;
      text-align: center;
      color: #666;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      line-height: 1.9;
      pointer-events: none;
      user-select: none;
      padding: 0 5vw;
      z-index: 5;
      transition: opacity 0.25s ease;
    }

    .static-text.top { top: calc(4vh + env(safe-area-inset-top, 0px)); }
    .static-text.bottom { bottom: calc(4vh + env(safe-area-inset-bottom, 0px)); }

    .static-text.top .title-line {
      display: block;
      color: #ddd;
      font-weight: 500;
      letter-spacing: 0.28em;
      margin-bottom: 0.7em;
    }

    .static-text.top .statement { display: block; }

    .scroll-cue {
      position: fixed;
      left: 50%;
      bottom: calc(2vh + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
      color: #aaa;
      opacity: 0.7;
      transition: opacity 0.35s ease, transform 0.35s ease;
      animation: cue-bob 2.2s ease-in-out infinite;
    }
    .scroll-cue svg { display: block; width: 18px; height: 18px; }
    .scroll-cue.hidden { opacity: 0; transform: translateX(-50%) translateY(6px); }
    @keyframes cue-bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(4px); }
    }

    .scroll-layer {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      z-index: 10;
    }
    .scroll-layer::-webkit-scrollbar { display: none; }
    .scroll-layer { scrollbar-width: none; }

    .scroll-spacer {
      width: 100%;
      height: 220dvh;
      pointer-events: none;
    }

    /* Citations panel: transparent, so the blurred image field stays
       visible behind it. The list relies on a soft text-shadow and
       a gentle top/bottom vignette rather than an opaque surface. */
    .citations {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 9;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: calc(6vh + env(safe-area-inset-bottom, 0px));
      padding-top: calc(10vh + env(safe-area-inset-top, 0px));
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s linear, transform 0.3s linear;
      pointer-events: none;
    }
    .citations.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* A soft dark vignette only at the very bottom, so the list has
       some ground to sit on without hiding the images. */
    .citations::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 40%;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0.55) 60%,
        rgba(0,0,0,0.85) 100%
      );
      z-index: -1;
    }

    .citations-inner {
      width: 100%;
      max-width: 100%;
      max-height: 100%;
      padding: 0 8vw;
      text-align: left;
      color: #999;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      line-height: 2;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      pointer-events: none;
      /* light text-shadow lifts the type off the blurred images
         without painting a panel over them */
      text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.7);
    }
    .citations.visible .citations-inner {
      pointer-events: auto;
    }
    .citations-inner::-webkit-scrollbar { display: none; }
    .citations-inner { scrollbar-width: none; }

    .citations-inner .group { margin-bottom: 1.4em; }
    .citations-inner .group-title {
      display: block;
      color: #ccc;
      font-weight: 400;
      letter-spacing: 0.2em;
      padding-bottom: 0.4em;
      margin-bottom: 0.4em;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .citations-inner .cite {
      display: flex;
      gap: 0.8em;
      white-space: normal;
      padding: 0.35em 0;
    }
    .citations-inner .cite .num { color: #ccc; flex: 0 0 auto; min-width: 2.4em; }
    .citations-inner .cite .name { color: #999; }

    @media (hover: none) and (pointer: coarse) {
      .annotation { font-size: 10px; letter-spacing: 0.28em; max-width: 45vw; }
      .static-text { font-size: 10px; letter-spacing: 0.22em; }
      .static-text.top .title-line { font-size: 11px; }
      .citations-inner { font-size: 10px; letter-spacing: 0.18em; }
    }
  </style>
</head>
<body>

  <div class="app" id="app">
    <div class="gallery">
      <div class="row row-top" id="rowTop">
        <div class="row-track" id="trackTop"></div>
      </div>
      <div class="row row-bottom" id="rowBottom">
        <div class="row-track" id="trackBottom"></div>
      </div>
    </div>

    <div class="static-text top" id="staticTop">
      <span class="title-line">Second Skin</span>
      <span class="statement">Textiles act as a second skin, forming an intimate boundary between ourselves and the outside world while shaping our sense of protection, exposure, and identity.</span>
    </div>
    <div class="static-text bottom" id="staticBottom">85% of discarded textiles end up in landfills or are incinerated. 60%-67% are synthetic (polyester, nylon, and acrylic).</div>
  </div>

  <div class="citations" id="citations">
    <div class="citations-inner" id="citationsInner"></div>
  </div>

  <div class="scroll-cue" id="scrollCue" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9l6 6 6-6" />
    </svg>
  </div>

  <div class="scroll-layer" id="scrollLayer">
    <div class="scroll-spacer"></div>
  </div>

  <script>
    (function() {
      const topImages = [
        'images/t01.png','images/t02.png','images/t03.png','images/t04.png',
        'images/t05.png','images/t06.png','images/t07.png'
      ];
      const bottomImages = [
        'images/b01.png','images/b02.jpg','images/b03.jpg','images/b04.jpg','images/b05.jpg',
        'images/b06.jpg','images/b07.jpg','images/b08.jpg','images/b09.jpg','images/b10.jpg'
      ];

      const topLabels = ['01','02','03','04','05','06','07'];
      const bottomLabels = ['08','09','10','11','12','13','14','15','16','17'];

      const topCitations = [
        { num: '01', name: 'Appelt, Dieter, Erste Hangung (fist hanging), From Monte Isola, 1976' },
        { num: '02', name: 'Coplans, John, Self-Portrait (Back No. 16), 1992' },
        { num: '03', name: 'Appelt, Dieter, Autoportrait, 1984' },
        { num: '04', name: 'Mapplethorpe, Robert, Frank Diaz, 1980' },
        { num: '05', name: 'Phipps, Chloe, Show Your Bones' },
        { num: '06', name: 'Coplans, John, Self-Portrait (Torso, Front), 1994' },
        { num: '07', name: 'Appelt, Dieter, Aus der Sequenz Ezra Pound, 1981-1981' },
      ];

      const bottomCitations = [
        { num: '08', name: 'near COP28 Dubai' },
        { num: '09', name: 'Placeholder image 09' },
        { num: '10', name: 'Placeholder image 10' },
        { num: '11', name: 'Placeholder image 11' },
        { num: '12', name: 'Placeholder image 12' },
        { num: '13', name: 'Placeholder image 13' },
        { num: '14', name: 'Placeholder image 14' },
        { num: '15', name: 'Placeholder image 15' },
        { num: '16', name: 'Placeholder image 16' },
        { num: '17', name: 'Placeholder image 17' },
      ];

      const TOP_COUNT = topImages.length;
      const BOTTOM_COUNT = bottomImages.length;

      const baseSpeed = 0.7;
      const friction = 0.94;

      const trackTop = document.getElementById('trackTop');
      const trackBottom = document.getElementById('trackBottom');
      const scrollLayer = document.getElementById('scrollLayer');
      const citationsEl = document.getElementById('citations');
      const citationsInner = document.getElementById('citationsInner');
      const appEl = document.getElementById('app');
      const staticTop = document.getElementById('staticTop');
      const staticBottom = document.getElementById('staticBottom');
      const scrollCue = document.getElementById('scrollCue');

      function buildCitations() {
        citationsInner.innerHTML = '';
        function makeGroup(title, items) {
          const group = document.createElement('div');
          group.className = 'group';
          const h = document.createElement('span');
          h.className = 'group-title';
          h.textContent = title;
          group.appendChild(h);
          items.forEach(c => {
            const row = document.createElement('div');
            row.className = 'cite';
            const n = document.createElement('span');
            n.className = 'num';
            n.textContent = c.num;
            const nm = document.createElement('span');
            nm.className = 'name';
            nm.textContent = c.name;
            row.appendChild(n);
            row.appendChild(nm);
            group.appendChild(row);
          });
          citationsInner.appendChild(group);
        }
        makeGroup('Top Row · 01–07', topCitations);
        makeGroup('Bottom Row · 08–17', bottomCitations);
      }
      buildCitations();

      function buildRow(track, imageList, labels, variant) {
        track.innerHTML = '';
        for (let copy = 0; copy < 3; copy++) {
          imageList.forEach((src, i) => {
            const cell = document.createElement('div');
            cell.className = 'img-cell';
            const wrap = document.createElement('div');
            wrap.className = 'img-wrap';
            const img = document.createElement('img');
            img.src = src;
            img.alt = '';
            img.loading = 'eager';
            img.addEventListener('load', () => { measureSoon(); });
            wrap.appendChild(img);
            const ann = document.createElement('span');
            ann.className = 'annotation';
            ann.textContent = labels[i] || '';
            if (variant === 'top') {
              cell.appendChild(ann);
              cell.appendChild(wrap);
            } else {
              cell.appendChild(wrap);
              cell.appendChild(ann);
            }
            track.appendChild(cell);
          });
        }
      }
      buildRow(trackTop, topImages, topLabels, 'top');
      buildRow(trackBottom, bottomImages, bottomLabels, 'bottom');

      let imgWidth = 0;
      let singleWidthTop = 0, singleWidthBottom = 0;
      let measureQueued = false;

      function measureSoon() {
        if (measureQueued) return;
        measureQueued = true;
        requestAnimationFrame(() => {
          measureQueued = false;
          measure();
        });
      }

      function measure() {
        const kidsTop = trackTop.children;
        if (kidsTop.length >= TOP_COUNT) {
          let topSum = 0;
          for (let i = 0; i < TOP_COUNT; i++) {
            const cell = kidsTop[i];
            if (!cell) continue;
            topSum += cell.getBoundingClientRect().width;
          }
          if (topSum > 0) {
            singleWidthTop = topSum;
            imgWidth = kidsTop[0].getBoundingClientRect().width;
          }
        }

        const kidsBottom = trackBottom.children;
        if (kidsBottom.length >= BOTTOM_COUNT) {
          let botSum = 0;
          for (let i = 0; i < BOTTOM_COUNT; i++) {
            const cell = kidsBottom[i];
            if (!cell) continue;
            botSum += cell.getBoundingClientRect().width;
          }
          if (botSum > 0) {
            singleWidthBottom = botSum;
            if (imgWidth <= 0 && kidsBottom[0]) {
              imgWidth = kidsBottom[0].getBoundingClientRect().width;
            }
          }
        }

        if (singleWidthTop > 0) state.topOffset = normalizeNeg(state.topOffset, singleWidthTop);
        if (singleWidthBottom > 0) state.bottomOffset = normalizeNeg(state.bottomOffset, singleWidthBottom);
      }

      function normalizeNeg(offset, w) {
        if (w <= 0) return offset;
        let o = offset % w;
        if (o > 0) o -= w;
        if (o <= -w) o += w;
        return o;
      }

      const state = {
        topOffset: 0,
        bottomOffset: 0,
        scrollTopSmoothed: 0,
        lastScrollTop: 0,
        lastTopTransform: null,
        lastBottomTransform: null,
        appBlur: 0,
        textOpacity: 1,
      };

      const drag = {
        active: false,
        moved: false,
        lastX: 0,
        lastMoveTime: 0,
        downX: 0,
        downY: 0,
        downTime: 0,
        topVelocity: 0,
        bottomVelocity: 0,
      };

      window.addEventListener('load', () => {
        measure();
        setTimeout(measure, 100);
        setTimeout(measure, 500);
        setTimeout(measure, 1500);
        requestAnimationFrame(tick);
      });
      window.addEventListener('resize', measure);
      window.addEventListener('orientationchange', () => {
        setTimeout(measure, 200);
        setTimeout(measure, 600);
      });

      const filterState = new WeakMap();
      const transformState = new WeakMap();

      function applyEffects(track, offset, vw, isTop) {
        const centerX = vw / 2;
        const startBlur = 60, influence = vw * 0.6, maxBlur = 6;
        const annStart = 200, annFull = 60;
        const kids = track.children;
        let cursor = 0;
        for (let i = 0; i < kids.length; i++) {
          const cell = kids[i];
          const rect = cell.getBoundingClientRect();
          const w = rect.width;
          const img = cell.querySelector('img');
          const wrap = cell.querySelector('.img-wrap');
          const ann = cell.querySelector('.annotation');
          const centerOfImage = offset + cursor + (w / 2);
          const dist = Math.abs(centerOfImage - centerX);
          const side = centerOfImage < centerX ? -1 : 1;

          let t = 0;
          if (dist > startBlur) {
            t = Math.min(1, (dist - startBlur) / (influence - startBlur));
          }

          const blur = t * maxBlur;
          const val = `blur(${blur.toFixed(1)}px)`;
          const prevFilter = filterState.get(img);
          if (prevFilter !== val) { img.style.filter = val; filterState.set(img, val); }

          const rotY = side * t * 14;
          const rotX = (isTop ? 1 : -1) * t * 3;
          const scale = 1 - t * 0.06;
          const translateZ = -t * 30;

          const transformStr = `perspective(1100px) rotateY(${rotY.toFixed(2)}deg) rotateX(${rotX.toFixed(2)}deg) translateZ(${translateZ.toFixed(1)}px) scale(${scale.toFixed(3)})`;
          const prevT = transformState.get(wrap);
          if (prevT !== transformStr) { wrap.style.transform = transformStr; transformState.set(wrap, transformStr); }

          let annOpacity = 0, annBlur = 4;
          if (dist < annStart) {
            const ta = Math.min(1, Math.max(0, (annStart - dist) / (annStart - annFull)));
            annOpacity = ta; annBlur = (1 - ta) * 4;
          }
          const oStr = annOpacity.toFixed(2), bStr = `blur(${annBlur.toFixed(1)}px)`;
          if (ann.style.opacity !== oStr) ann.style.opacity = oStr;
          if (ann.style.filter !== bStr) ann.style.filter = bStr;

          cursor += w;
        }
      }

      let lastTime = performance.now(), effectTick = 0;

      function setTransform(track, lastKey, offset) {
        const t = `translate3d(${offset}px, 0, 0)`;
        if (state[lastKey] !== t) { track.style.transform = t; state[lastKey] = t; }
      }

      const SCROLL_DRIVE = 1.4;
      const BLUR_RANGE = 260;
      const MAX_APP_BLUR = 8;

      function tick(now) {
        if (!now) now = performance.now();
        let dt = now - lastTime; if (dt > 50) dt = 50;
        lastTime = now;
        const fs = dt / 16.6667;

        const scrollTop = scrollLayer.scrollTop;
        const scrollDelta = scrollTop - state.lastScrollTop;
        state.lastScrollTop = scrollTop;

        state.scrollTopSmoothed += scrollDelta * 0.35;

        if (singleWidthTop > 0 && singleWidthBottom > 0) {
          state.topOffset -= baseSpeed * fs;
          state.bottomOffset += baseSpeed * fs;

          const drive = state.scrollTopSmoothed * SCROLL_DRIVE;
          state.topOffset -= drive;
          state.bottomOffset += drive;
          state.scrollTopSmoothed *= Math.pow(0.85, fs);
          if (Math.abs(state.scrollTopSmoothed) < 0.01) state.scrollTopSmoothed = 0;

          if (!drag.active) {
            state.topOffset -= drag.topVelocity * fs;
            state.bottomOffset += drag.bottomVelocity * fs;
            drag.topVelocity *= Math.pow(friction, fs);
            drag.bottomVelocity *= Math.pow(friction, fs);
            if (Math.abs(drag.topVelocity) < 0.01) drag.topVelocity = 0;
            if (Math.abs(drag.bottomVelocity) < 0.01) drag.bottomVelocity = 0;
          }

          state.topOffset = normalizeNeg(state.topOffset, singleWidthTop);
          state.bottomOffset = normalizeNeg(state.bottomOffset, singleWidthBottom);
          setTransform(trackTop, 'lastTopTransform', state.topOffset);
          setTransform(trackBottom, 'lastBottomTransform', state.bottomOffset);
        }

        const t = Math.min(1, Math.max(0, scrollTop / BLUR_RANGE));
        const appBlur = t * MAX_APP_BLUR;
        if (Math.abs(state.appBlur - appBlur) > 0.05) {
          state.appBlur = appBlur;
          appEl.style.filter = `blur(${appBlur.toFixed(1)}px)`;
        }
        const textOpacity = (1 - t).toFixed(2);
        if (state.textOpacity !== textOpacity) {
          state.textOpacity = textOpacity;
          staticTop.style.opacity = textOpacity;
          staticBottom.style.opacity = textOpacity;
        }

        const revealAt = 40;
        if (scrollTop > revealAt) {
          citationsEl.classList.add('visible');
        } else {
          citationsEl.classList.remove('visible');
        }

        if (scrollTop > 12) {
          scrollCue.classList.add('hidden');
        } else {
          scrollCue.classList.remove('hidden');
        }

        if (++effectTick % 2 === 0) {
          const vw = window.innerWidth;
          if (singleWidthTop > 0) applyEffects(trackTop, state.topOffset, vw, true);
          if (singleWidthBottom > 0) applyEffects(trackBottom, state.bottomOffset, vw, false);
        }
        requestAnimationFrame(tick);
      }

      let pointerDownY = 0;
      citationsInner.addEventListener('touchstart', (e) => {
        pointerDownY = e.touches[0].clientY;
      }, { passive: true });

      citationsInner.addEventListener('touchmove', (e) => {
        const dy = e.touches[0].clientY - pointerDownY;
        if (citationsInner.scrollTop <= 0 && dy > 0) {
          scrollLayer.scrollTop = Math.max(0, scrollLayer.scrollTop - dy * 0.6);
        }
        pointerDownY = e.touches[0].clientY;
      }, { passive: true });

      citationsInner.addEventListener('wheel', (e) => {
        if (citationsInner.scrollTop <= 0 && e.deltaY < 0) {
          scrollLayer.scrollTop = Math.max(0, scrollLayer.scrollTop + e.deltaY);
        }
      }, { passive: true });

      let pointerDownX = 0, pointerId = null, dragStarted = false;

      document.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.citations-inner')) return;
        pointerDownX = e.clientX;
        pointerDownY = e.clientY;
        pointerId = e.pointerId;
        dragStarted = false;
        drag.active = true;
        drag.moved = false;
        drag.lastX = e.clientX;
        drag.lastMoveTime = performance.now();
        drag.topVelocity = 0;
        drag.bottomVelocity = 0;
      });

      document.addEventListener('pointermove', (e) => {
        if (!drag.active || e.pointerId !== pointerId) return;
        const dx = e.clientX - drag.lastX;
        const now = performance.now(); const dt = Math.max(1, now - drag.lastMoveTime);
        const totalDx = Math.abs(e.clientX - pointerDownX);
        const totalDy = Math.abs(e.clientY - pointerDownY);
        if (!dragStarted) {
          if (totalDx > 8 && totalDx > totalDy) {
            dragStarted = true;
            drag.moved = true;
            scrollLayer.style.pointerEvents = 'none';
          } else if (totalDy > 8) {
            drag.active = false;
            return;
          }
        }
        if (dragStarted) {
          drag.lastX = e.clientX;
          drag.lastMoveTime = now;
          const v = (dx / dt) * 16;
          drag.topVelocity = v;
          drag.bottomVelocity = v;
          state.topOffset -= dx;
          state.bottomOffset += dx;
        }
      });

      function endDrag(e) {
        if (!drag.active || e.pointerId !== pointerId) return;
        drag.active = false;
        if (dragStarted) {
          scrollLayer.style.pointerEvents = '';
          dragStarted = false;
        }
      }
      document.addEventListener('pointerup', endDrag);
      document.addEventListener('pointercancel', endDrag);

      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('dragstart', e => e.preventDefault());

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
